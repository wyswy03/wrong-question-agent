<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>错题本</title>
  <link rel="stylesheet" href="/styles.css?v=2" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Wrong Question Bank</p>
      <h1>错题本</h1>
      <p class="share" id="shareLine">正在准备你的专属错题本…</p>
    </div>
    <div class="stats" id="stats">
      <span>题库 0</span>
      <span>待练 0</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="capture">拍照入库</button>
    <button class="tab" data-tab="library">题库</button>
    <button class="tab" data-tab="practice">练习</button>
  </nav>

  <main>
    <section id="capture" class="panel active">
      <div class="card camera-card">
        <video id="camera" autoplay playsinline hidden></video>
        <canvas id="shot" hidden></canvas>
        <img id="preview" alt="预览" hidden />
        <button type="button" id="btnPhotoIn" class="primary full">拍照入库</button>
        <div class="camera-actions">
          <button type="button" id="btnStart" class="ghost live-cam">打开摄像头预览</button>
          <button type="button" id="btnSnap" class="ghost live-cam">从预览截图</button>
          <label class="ghost file-btn">从相册选图
            <input id="fileAlbum" type="file" accept="image/*" hidden />
          </label>
        </div>
        <input id="file" type="file" accept="image/*" capture="environment" hidden />
        <p class="hint">点「拍照入库」拍一张就会进题库。识别出的文字可在下方修改后点「更新本题」，不要再点一次「放入错题库」。</p>
      </div>

      <form id="form" class="card form">
        <label>学科（拍照后也可再补）
          <input name="subject" placeholder="如：数学 / 英语 / 物理" />
        </label>
        <label>来源
          <input name="source" placeholder="如：期中卷、课时作业 P32" />
        </label>
        <label>题目（可空，有照片就能入库）
          <textarea name="stem" rows="5" placeholder="可不填。有照片时练习会显示图片。"></textarea>
        </label>
        <label>选项（每行一个，可空）
          <textarea name="options" rows="4" placeholder="A. ...&#10;B. ..."></textarea>
        </label>
        <div class="row">
          <label>正确答案
            <input name="correctAnswer" placeholder="如：B 或 3/4" />
          </label>
          <label>当时错选
            <input name="userWrongAnswer" placeholder="如：C" />
          </label>
        </div>
        <label>知识点
          <input name="knowledge" placeholder="如：二次函数顶点式" />
        </label>
        <label>解析
          <textarea name="explanation" rows="4" placeholder="为什么错、正确做法"></textarea>
        </label>
        <label>标签（逗号分隔）
          <input name="tags" placeholder="填空, 易错, 计算" />
        </label>
        <button type="submit" class="primary full">放入错题库</button>
        <p class="hint save-ok" hidden></p>
      </form>
    </section>

    <section id="library" class="panel">
      <div class="toolbar">
        <input id="filterSubject" placeholder="按学科筛选" />
        <input id="search" placeholder="搜索题目 / 知识点" />
      </div>
      <div id="list" class="list"></div>
    </section>

    <section id="practice" class="panel">
      <div class="toolbar">
        <input id="practiceSubject" placeholder="只练某学科，可空" />
        <input id="practiceN" type="number" min="1" max="30" value="8" />
        <button type="button" id="btnQuiz" class="primary">开始练习</button>
      </div>
      <div id="quiz" class="quiz"></div>
    </section>
  </main>

  <script src="/app.js?v=8"></script>
</body>
</html>
